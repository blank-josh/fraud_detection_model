[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudscope"
version = "0.1.0"
description = "Leakage-aware fraud detection research workflow"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
